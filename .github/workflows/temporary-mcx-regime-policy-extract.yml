name: temporary-mcx-regime-policy-extract

on:
  push:
    branches:
      - agent/extract-mcx-regime-policy-core

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/extract-mcx-regime-policy-core
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prove pinned base and pre-extraction runtime state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev-clean --quiet
          test "$(git rev-parse origin/dev-clean)" = "72a2c5759e17a3fd0477f62724d6fd4490be1c8f"
          test "$(git rev-parse --abbrev-ref HEAD)" = "agent/extract-mcx-regime-policy-core"
          if [ ! -f js/services/mcx-regime-policy.js ]; then
            test -z "$(git diff 72a2c5759e17a3fd0477f62724d6fd4490be1c8f...HEAD -- index.html js/)"
          fi

      - name: Apply exact guarded extraction
        run: node tests/tools/temporary-mcx-regime-policy-extract.js

      - name: Syntax and focused behavioral gates
        shell: bash
        run: |
          set -euo pipefail
          node --check js/services/mcx-regime-policy.js
          node tests/mcx-regime-rules.test.js
          node tests/mcx-sma20-rising-defense-rule.test.js
          node tests/mcx-refresh-on-open-freshness.test.js
          git diff --check

      - name: Commit extraction only if production changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html js/services/mcx-regime-policy.js tests/tools/temporary-mcx-regime-policy-pins.json; then
            echo 'extraction already current'
            exit 0
          fi
          git add index.html js/services/mcx-regime-policy.js tests/tools/temporary-mcx-regime-policy-pins.json
          test -z "$(git diff --cached --name-only | grep -Ev '^(index.html|js/services/mcx-regime-policy.js|tests/tools/temporary-mcx-regime-policy-pins.json)$' || true)"
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(mcx): extract regime policy core"
          git push origin HEAD:agent/extract-mcx-regime-policy-core
