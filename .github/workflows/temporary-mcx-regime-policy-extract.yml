name: temporary-mcx-regime-policy-extract

on:
  pull_request:
    branches:
      - dev-clean
    types: [edited, synchronize]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/extract-mcx-regime-policy-core
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prove pinned base and exact runtime footprint
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev-clean --quiet
          test "$(git rev-parse origin/dev-clean)" = "72a2c5759e17a3fd0477f62724d6fd4490be1c8f"
          test "$(git rev-parse --abbrev-ref HEAD)" = "agent/extract-mcx-regime-policy-core"
          runtime_changed="$(git diff --name-only 72a2c5759e17a3fd0477f62724d6fd4490be1c8f...HEAD -- index.html js/ | sort)"
          expected=$'index.html\njs/services/mcx-regime-policy.js'
          test "$runtime_changed" = "$expected"
          git diff --check

      - name: Apply fail-closed historical contract repair
        run: node tests/tools/temporary-mcx-regime-policy-repair-v3.js

      - name: Repair check — backend directional adapter
        run: node tests/backend-directional-adapter-boundary-contract.test.js
      - name: Repair check — backend directional preview
        run: node tests/backend-directional-preview-boundary-contract.test.js
      - name: Repair check — backend directional snapshot
        run: node tests/backend-directional-snapshot-boundary-contract.test.js
      - name: Repair check — backend scanner snapshot UI
        run: node tests/backend-scanner-snapshot-ui-boundary-contract.test.js
      - name: Repair check — Journal Core
        run: node tests/journal-core-boundary-contract.test.js
      - name: Repair check — MCX backend candles
        run: node tests/mcx-backend-candles-boundary-contract.test.js

      - name: Repair check — remaining consumer matrix
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/regime-consumers
          failed=0
          run_one() {
            label="$1"
            file="$2"
            node "$file" >"/tmp/regime-consumers/${label}.log" 2>&1
            rc=$?
            printf '%s rc=%s\n' "$label" "$rc" | tee -a /tmp/regime-consumers/status.txt
            if [ "$rc" -ne 0 ]; then
              failed=1
              grep -n -E 'FAIL|FAILURES|TypeError|ReferenceError|AssertionError|expected .*got' "/tmp/regime-consumers/${label}.log" | head -80 || true
            fi
          }
          run_one mcx-market-context tests/mcx-market-context-boundary-contract.test.js
          run_one mcx-vix-market-context tests/mcx-vix-market-context-boundary-contract.test.js
          run_one pess tests/pess-extraction-boundary-contract.test.js
          run_one pretrade-risk-modal tests/pretrade-risk-modal-boundary-contract.test.js
          run_one pretrade-risk-rules tests/pretrade-risk-rules-boundary-contract.test.js
          run_one pretrade-technicals tests/pretrade-technicals-boundary-contract.test.js
          run_one regime-naked-calls tests/regime-naked-calls.test.js
          run_one sfs tests/sfs-extraction-boundary-contract.test.js
          exit "$failed"

      - name: Preserve remaining consumer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcx-regime-policy-remaining-consumer-logs
          path: /tmp/regime-consumers
          if-no-files-found: error
          retention-days: 1

      - name: Verify repaired tree
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git diff --name-only -- index.html js/)"

      - name: Commit test-only repair
        shell: bash
        run: |
          set -euo pipefail
          git add tests/
          test -z "$(git diff --cached --name-only | grep -Ev '^tests/' || true)"
          if git diff --cached --quiet; then
            echo 'repair already current'
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(mcx): align historical contracts with regime policy"
          git push origin HEAD:agent/extract-mcx-regime-policy-core
