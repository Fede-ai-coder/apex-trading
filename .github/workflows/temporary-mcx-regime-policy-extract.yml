name: temporary-mcx-regime-policy-extract

on:
  pull_request:
    branches:
      - dev-clean
    types: [reopened]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/extract-mcx-regime-policy-core
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prove pinned base and exact runtime footprint
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev-clean --quiet
          test "$(git rev-parse origin/dev-clean)" = "72a2c5759e17a3fd0477f62724d6fd4490be1c8f"
          test "$(git rev-parse --abbrev-ref HEAD)" = "agent/extract-mcx-regime-policy-core"
          runtime_changed="$(git diff --name-only 72a2c5759e17a3fd0477f62724d6fd4490be1c8f...HEAD -- index.html js/ | sort)"
          expected=$'index.html\njs/services/mcx-regime-policy.js'
          test "$runtime_changed" = "$expected"
          git diff --check

      - name: Apply fail-closed historical contract repair
        run: node tests/tools/temporary-mcx-regime-policy-repair.js

      - name: Run repaired consumers
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            tests/backend-directional-adapter-boundary-contract.test.js \
            tests/backend-directional-preview-boundary-contract.test.js \
            tests/backend-directional-snapshot-boundary-contract.test.js \
            tests/backend-scanner-snapshot-ui-boundary-contract.test.js \
            tests/journal-core-boundary-contract.test.js \
            tests/mcx-backend-candles-boundary-contract.test.js \
            tests/mcx-market-context-boundary-contract.test.js \
            tests/mcx-vix-market-context-boundary-contract.test.js \
            tests/pess-extraction-boundary-contract.test.js \
            tests/pretrade-risk-modal-boundary-contract.test.js \
            tests/pretrade-risk-rules-boundary-contract.test.js \
            tests/pretrade-technicals-boundary-contract.test.js \
            tests/regime-naked-calls.test.js \
            tests/sfs-extraction-boundary-contract.test.js; do
            node "$f"
          done
          git diff --check
          test -z "$(git diff --name-only -- index.html js/)"

      - name: Commit test-only repair
        shell: bash
        run: |
          set -euo pipefail
          git add tests/
          test -z "$(git diff --cached --name-only | grep -Ev '^tests/' || true)"
          if git diff --cached --quiet; then
            echo 'repair already current'
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(mcx): align historical contracts with regime policy"
          git push origin HEAD:agent/extract-mcx-regime-policy-core
