name: temporary-mcx-regime-policy-extract

on:
  push:
    branches:
      - agent/extract-mcx-regime-policy-core
  pull_request:
    branches:
      - dev-clean
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/extract-mcx-regime-policy-core
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prove pinned base and exact runtime footprint
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev-clean --quiet
          test "$(git rev-parse origin/dev-clean)" = "72a2c5759e17a3fd0477f62724d6fd4490be1c8f"
          test "$(git rev-parse --abbrev-ref HEAD)" = "agent/extract-mcx-regime-policy-core"
          runtime_changed="$(git diff --name-only 72a2c5759e17a3fd0477f62724d6fd4490be1c8f...HEAD -- index.html js/ | sort)"
          expected=$'index.html\njs/services/mcx-regime-policy.js'
          test "$runtime_changed" = "$expected"
          git diff --check

      - name: Capture exact Node 22 failure set
        shell: bash
        run: |
          set -euo pipefail
          report=tests/tools/temporary-mcx-regime-policy-failures.txt
          : > "$report"
          failed=0
          for f in tests/*.test.js; do
            if node "$f" > /tmp/mcx-regime-suite.log 2>&1; then
              continue
            fi
            failed=1
            printf '===== %s =====\n' "$f" >> "$report"
            tail -80 /tmp/mcx-regime-suite.log >> "$report"
            printf '\n' >> "$report"
          done
          if [ "$failed" -eq 0 ]; then
            printf 'ALL_GREEN\n' > "$report"
          fi
          cat "$report"

      - name: Commit diagnostic report if changed
        shell: bash
        run: |
          set -euo pipefail
          report=tests/tools/temporary-mcx-regime-policy-failures.txt
          git add "$report"
          if git diff --cached --quiet; then
            echo 'diagnostic report already current'
            exit 0
          fi
          test -z "$(git diff --cached --name-only | grep -v '^tests/tools/temporary-mcx-regime-policy-failures.txt$' || true)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(mcx): record regime-policy failure set"
          git push origin HEAD:agent/extract-mcx-regime-policy-core
