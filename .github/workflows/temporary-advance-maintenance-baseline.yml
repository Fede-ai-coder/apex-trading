name: temporary-advance-maintenance-baseline

on:
  pull_request:
    branches: [dev-clean]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/dev-clean-direct-push-gate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: advance only historical CI maintenance baselines
        env:
          OLD_BASE: dbfd441b6135ac167763391e57e4c9ce068aa308
          NEW_BASE: 9a0bf91e3ca79e1b042caaa2e98ff6e2bdd073aa
          BRANCH: fix/dev-clean-direct-push-gate
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          files = [
              'tests/mcx-market-context-boundary-contract.test.js',
              'tests/pretrade-risk-modal-boundary-contract.test.js',
              'tests/pretrade-risk-rules-boundary-contract.test.js',
              'tests/pretrade-technicals-boundary-contract.test.js',
          ]
          old = os.environ['OLD_BASE']
          new = os.environ['NEW_BASE']
          for name in files:
              p = Path(name)
              src = p.read_text()
              count = src.count(old)
              if count != 1:
                  raise SystemExit(f'{name}: expected exactly one old baseline, found {count}')
              p.write_text(src.replace(old, new, 1))
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/mcx-market-context-boundary-contract.test.js \
                  tests/pretrade-risk-modal-boundary-contract.test.js \
                  tests/pretrade-risk-rules-boundary-contract.test.js \
                  tests/pretrade-technicals-boundary-contract.test.js
          git commit -m "test: advance direct-push maintenance scope baseline"
          git push origin "HEAD:$BRANCH"
