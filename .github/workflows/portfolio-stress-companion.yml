name: temporary-ci-maintenance-patch

on:
  push:
    branches: [fix/ci-diff-check-maintenance-baseline]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: patch historical maintenance scope and restore final workflow
        env:
          MAINTENANCE_SCOPE_BASE: dbfd441b6135ac167763391e57e4c9ce068aa308
          BRANCH: fix/ci-diff-check-maintenance-baseline
        run: |
          python - <<'PY'
          from pathlib import Path

          baseline = 'dbfd441b6135ac167763391e57e4c9ce068aa308'
          replacements = {
              'tests/mcx-market-context-boundary-contract.test.js': (
                  "  ok(!changed.some((p) => p.startsWith('.github/') || p.startsWith('scripts/') || p.startsWith('config/') || p.startsWith('contracts/')), 'no workflow, bootstrap, config or manifest file was touched');",
                  "  const maintenanceScopeChanged = execFileSync('git', ['diff', '--name-only', '" + baseline + "', 'HEAD'], { cwd: ROOT, encoding: 'utf8' }).trim().split(/\\r?\\n/).filter(Boolean);\n"
                  "  ok(!maintenanceScopeChanged.some((p) => p.startsWith('.github/') || p.startsWith('scripts/') || p.startsWith('config/') || p.startsWith('contracts/')), 'no workflow, bootstrap, config or manifest file changed after the CI maintenance baseline');"
              ),
              'tests/pretrade-risk-modal-boundary-contract.test.js': (
                  "ok(!changed.some(p=>p.startsWith('.github/')||p.startsWith('scripts/')),'no workflow or bootstrap script was touched');",
                  "const maintenanceScopeChanged=execFileSync('git',['diff','--name-only','" + baseline + "','HEAD'],{cwd:ROOT,encoding:'utf8'}).trim().split(/\\r?\\n/).filter(Boolean);\n"
                  "ok(!maintenanceScopeChanged.some(p=>p.startsWith('.github/')||p.startsWith('scripts/')),'no workflow or bootstrap script changed after the CI maintenance baseline');"
              ),
              'tests/pretrade-risk-rules-boundary-contract.test.js': (
                  "ok(!changed.some(p=>p.startsWith('.github/')||p.startsWith('scripts/')),'no bootstrap workflow/script remains in final tree');",
                  "const maintenanceScopeChanged=execFileSync('git',['diff','--name-only','" + baseline + "','HEAD'],{cwd:ROOT,encoding:'utf8'}).trim().split(/\\r?\\n/).filter(Boolean);\n"
                  "ok(!maintenanceScopeChanged.some(p=>p.startsWith('.github/')||p.startsWith('scripts/')),'no bootstrap workflow/script changed after the CI maintenance baseline');"
              ),
              'tests/pretrade-technicals-boundary-contract.test.js': (
                  "ok(!changed.some(p=>p.startsWith('.github/')||p.startsWith('scripts/')),'no bootstrap workflow/script remains in final tree');",
                  "const maintenanceScopeChanged=execFileSync('git',['diff','--name-only','" + baseline + "','HEAD'],{cwd:ROOT,encoding:'utf8'}).trim().split(/\\r?\\n/).filter(Boolean);\n"
                  "ok(!maintenanceScopeChanged.some(p=>p.startsWith('.github/')||p.startsWith('scripts/')),'no bootstrap workflow/script changed after the CI maintenance baseline');"
              ),
          }

          for rel, (old, new) in replacements.items():
              p = Path(rel)
              src = p.read_text()
              count = src.count(old)
              if count != 1:
                  raise SystemExit(f'{rel}: expected exactly one replacement target, got {count}')
              p.write_text(src.replace(old, new, 1))

          Path('tests/ci-pr-diff-check-contract.test.js').write_text(r'''\
'use strict';

const fs = require('fs');
const path = require('path');

const ROOT = path.resolve(__dirname, '..');
const WORKFLOW = fs.readFileSync(path.join(ROOT, '.github/workflows/portfolio-stress-companion.yml'), 'utf8');
let pass = 0, fail = 0;
function ok(v, msg) { if (v) pass++; else { fail++; console.log('  FAIL  ' + msg); } }

console.log('CI committed-diff whitespace contract');

const prLine = 'git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"';
const pushLine = 'git diff --check "${{ github.event.before }}" "${{ github.sha }}"';
const manualLine = 'git diff --check HEAD^1 HEAD';

ok(WORKFLOW.includes(prLine), 'pull_request checks merge-base-to-head committed diff');
ok(WORKFLOW.includes(pushLine), 'push checks the complete pushed range');
ok(WORKFLOW.includes(manualLine), 'workflow_dispatch has a deterministic commit fallback');
ok(!/^\s*run:\s*git diff --check HEAD\s*$/m.test(WORKFLOW), 'the ineffective clean-tree check is absent');
ok(WORKFLOW.includes('if [ "${{ github.event_name }}" = "pull_request" ]; then'), 'event routing is explicit');
ok(WORKFLOW.includes('elif [ "${{ github.event_name }}" = "push" ]; then'), 'push routing is explicit');

const mutant = WORKFLOW.replace(prLine, 'git diff --check HEAD');
ok(!mutant.includes(prLine), 'negative control removes the PR committed-diff command');
ok(/^\s*run:\s*git diff --check HEAD\s*$/m.test('        run: git diff --check HEAD\n'), 'negative control recognises the old ineffective form');

console.log('\nCI diff-check contract: ' + pass + ' passed, ' + fail + ' failed');
if (fail) process.exit(1);
console.log('ALL TESTS PASSED');
''')
          PY

          git show "$MAINTENANCE_SCOPE_BASE:.github/workflows/portfolio-stress-companion.yml" > .github/workflows/portfolio-stress-companion.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/portfolio-stress-companion.yml \
                  tests/mcx-market-context-boundary-contract.test.js \
                  tests/pretrade-risk-modal-boundary-contract.test.js \
                  tests/pretrade-risk-rules-boundary-contract.test.js \
                  tests/pretrade-technicals-boundary-contract.test.js \
                  tests/ci-pr-diff-check-contract.test.js
          git diff --cached --check
          git commit -m "test: advance historical CI maintenance scope baseline"
          git push origin "HEAD:$BRANCH"
