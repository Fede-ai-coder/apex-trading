# ══════════════════════════════════════════════════════════════════════════
# Portfolio Stress — frontend companion contract suites.
#
# WHY THIS EXISTS
#   The only check this PR had was a Netlify deploy preview. A green preview
#   proves the site builds; it proves nothing about the contracts this PR is
#   entirely made of. Everything below used to be "verified locally", which is a
#   claim a reviewer has to take on trust.
#
# THE STRICT JOB IS THE POINT
#   The structural job runs offline against this repository alone. The STRICT job
#   checks out apex-backend AT AN EXACT COMMIT and re-derives every recorded
#   hash, evidence snippet and zero-count from it. The commit is pinned in this
#   file — never a branch tip — because a branch tip is a moving target and
#   "verified against the branch" would mean verified against whatever landed
#   last. A negative control then proves the same evidence FAILS against the
#   PRE-ENGINE BASE, so a green strict run cannot be green by accident.
#
#   Nothing here reaches the network after the checkouts.
# ══════════════════════════════════════════════════════════════════════════
name: portfolio-stress-companion

on:
  pull_request:
    branches: [dev-clean]
  push:
    branches:
      - claude/portfolio-stress-backend-parity-v1
      - claude/portfolio-stress-ui-v1-stsyh3
  workflow_dispatch:

# THREE backend commits, with three different jobs. They were previously two, and
# one of the two was misnamed in a way that mattered: 25dd8424 was labelled as the
# deployed commit, and it has not been what is deployed since the engine merged. A
# variable named "deployed" that names a commit nobody runs is the kind of label a
# reader trusts and should not.
#
#   AUDITED_IMPLEMENTATION  the commit every recorded hash, evidence snippet and
#                           zero-count is derived from. A PIN, not a branch: bump
#                           it deliberately, in the same commit that updates the
#                           hashes it justifies.
#
#   DEV_DEPLOYED_MERGE      what Railway dev actually runs, per a manual
#                           GET /version check by the maintainer (source=env,
#                           RAILWAY_GIT_COMMIT_SHA). Recorded because the audited
#                           commit and the running commit are DIFFERENT COMMITS
#                           carrying the SAME SOURCE TREE — which is what makes the
#                           audited evidence describe the running service. Not
#                           checked out here: it is a fact on the record, not an
#                           input to a job.
#
#   NEGATIVE_CONTROL        the pre-engine base. It MUST FAIL the evidence. Its
#                           whole purpose is to prove a green strict run cannot be
#                           green by accident, so it is named for that job rather
#                           than for a deployment status it no longer has.
env:
  BACKEND_REPO: Fede-ai-coder/apex-backend
  BACKEND_AUDITED_IMPLEMENTATION_COMMIT: 12f3ba1821d809d5d9dbf86b86e8199e84e14119
  BACKEND_DEV_DEPLOYED_MERGE_COMMIT: 470316ba3ef194ee6c56d9eb22da04b435d29f3c
  BACKEND_NEGATIVE_CONTROL_COMMIT: 25dd84245d8176bd6c3daa05be98e52afe0a934a

jobs:
  contracts:
    name: contract suites (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      # Full history. The architecture contract compares this branch against its
      # declared base commit and walks only the commits THIS BRANCH adds; with a
      # shallow clone the base is unreachable and those checks would skip rather
      # than run — a green suite that verified less than it appears to.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # No `npm install`. The suites import Node builtins and local test helpers
      # only, so an absent node_modules is itself the proof that no third-party
      # dependency crept into a contract test.
      - name: syntax check every companion module and suite
        run: |
          for f in js/services/portfolio-stress-*.js js/ui/portfolio-stress-*.js \
                   js/api/backend-client.js tests/lib/portfolio-stress-*.js \
                   tests/portfolio-stress-*.test.js; do
            node --check "$f"
          done

      - name: JSON parses
        run: |
          node -e "JSON.parse(require('fs').readFileSync('config/risk-models/portfolio-stress-test-v1.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('contracts/portfolio-scope-parity-manifest.json','utf8'))"

      - name: model contract
        run: node tests/portfolio-stress-model-contract.test.js

      - name: architecture contract
        run: node tests/portfolio-stress-architecture-contract.test.js

      - name: reuse contract
        run: node tests/portfolio-stress-reuse-contract.test.js

      - name: source facts (structural)
        run: node tests/portfolio-stress-source-facts.test.js

      - name: parity runtime
        run: node tests/portfolio-stress-parity-runtime.test.js

      - name: client contract
        run: node tests/portfolio-stress-client-contract.test.js

      - name: null safety
        run: node tests/portfolio-stress-null-safety.test.js

      # ── the UI tier (revision 1.3.0) ─────────────────────────────────────
      # Named steps rather than only the full-suite loop below, so a failure
      # says WHICH contract broke instead of "some suite failed".
      - name: UI architecture contract
        run: node tests/portfolio-stress-ui-architecture.test.js

      - name: UI render contract (null is never zero)
        run: node tests/portfolio-stress-ui-render.test.js

      - name: UI lifecycle contract (abort, staleness, 409, divergence)
        run: node tests/portfolio-stress-ui-lifecycle.test.js

      - name: UI overlay builder contract
        run: node tests/portfolio-stress-ui-overlay.test.js

      - name: UI matrix contract (one request, right squares)
        run: node tests/portfolio-stress-ui-matrix.test.js

      - name: UI mutation proof
        run: node tests/portfolio-stress-ui-mutation.test.js

      # Structural half only. The cross-tier half needs an apex-backend checkout
      # and runs in the strict job below, where it is REQUIRED rather than
      # skipped — see the PST_REQUIRE_BACKEND_SOURCE step there.
      - name: UI scenario request contract (structural half)
        run: node tests/portfolio-stress-ui-scenario-contract.test.js

      # On node 22 the full suite must be GREEN — no exceptions, no allowances.
      - name: full frontend suite (node 22)
        if: matrix.node == '22'
        run: |
          fail=0
          for f in tests/*.test.js; do
            if ! node "$f" > /tmp/out.log 2>&1; then
              echo "::error file=$f::suite failed"
              tail -40 /tmp/out.log
              fail=1
            fi
          done
          exit $fail

      # On node 20, four DSB/scanner boundary suites already fail AT THE BASE
      # COMMIT on a vm-sandbox proxy-trap difference between the runtimes. They
      # are allowed — but ONLY for the exact cause measured for each of them.
      #
      # The rule is not written here on purpose. Shell in a workflow is a rule
      # nobody can test: you would find out whether it rejects a SyntaxError by
      # pushing a SyntaxError. tests/lib/node20-known-failures.js owns the
      # decision as a pure function, the architecture contract feeds it synthetic
      # SyntaxError / AssertionError / TypeError outputs and proves it rejects
      # them even for a listed filename, and this step just runs it.
      #
      # It fails if a listed file passes, fails for a different cause, fails for
      # a forbidden cause, disappears, is listed without a measured fingerprint,
      # or if any UNLISTED file fails.
      - name: full frontend suite (node 20) — known failures pinned to their measured cause
        if: matrix.node == '20'
        run: node tests/lib/node20-known-failures.js --run

      - name: git diff --check
        run: git diff --check HEAD

  # Cross-repo, so it needs a token that can read apex-backend. The default
  # GITHUB_TOKEN is scoped to THIS repository and returns "Repository not found"
  # for a private sibling — which is what the first run of this workflow proved.
  #
  # The job therefore runs only when BACKEND_READ_TOKEN exists, and the companion
  # PR body says plainly that strict verification is locally executed until the
  # secret is configured. A job that silently degraded to "green because it did
  # not run" would be worse than no job at all.
  strict-source-facts:
    name: strict source facts vs the pinned backend commit
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || vars.BACKEND_READ_TOKEN_CONFIGURED == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: apex-trading

      # An EXACT commit. `ref` is a full sha, so this cannot silently follow a
      # branch that moved after the evidence was recorded.
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.BACKEND_REPO }}
          ref: ${{ env.BACKEND_AUDITED_IMPLEMENTATION_COMMIT }}
          path: apex-backend
          fetch-depth: 0
          token: ${{ secrets.BACKEND_READ_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: the checkout really is the pinned commit
        working-directory: apex-backend
        run: |
          actual="$(git rev-parse HEAD)"
          echo "checked out: $actual"
          if [ "$actual" != "${{ env.BACKEND_AUDITED_IMPLEMENTATION_COMMIT }}" ]; then
            echo "::error::expected ${{ env.BACKEND_AUDITED_IMPLEMENTATION_COMMIT }}, got $actual"
            exit 1
          fi

      # From here on nothing touches the network.
      - name: strict source facts
        working-directory: apex-trading
        env:
          PST_REQUIRE_BACKEND_SOURCE: '1'
          APEX_BACKEND_PATH: ${{ github.workspace }}/apex-backend
        run: node tests/portfolio-stress-source-facts.test.js

      # THE CROSS-TIER CHECK. This is the one that can fail for the reason the
      # six UI suites structurally cannot: it feeds the REAL scenarios the UI
      # builds to the REAL backend normalizeScenario, at the audited commit.
      # PST_REQUIRE_BACKEND_SOURCE=1 means a skip is a FAILURE here — a green run
      # that quietly did not exercise the backend is exactly what this step
      # exists to make impossible.
      - name: strict UI scenario request contract vs the real backend normalizer
        working-directory: apex-trading
        env:
          PST_REQUIRE_BACKEND_SOURCE: '1'
          APEX_BACKEND_PATH: ${{ github.workspace }}/apex-backend
        run: node tests/portfolio-stress-ui-scenario-contract.test.js

      - name: the parity manifest copy is byte-identical to the backend's
        run: |
          cmp apex-trading/contracts/portfolio-scope-parity-manifest.json \
              apex-backend/contracts/portfolio-scope-parity-manifest.json

      # NEGATIVE CONTROL. The strict suite carries its own controls against the
      # PRE-ENGINE BASE, but they only run when that commit is fetchable, so it is
      # fetched explicitly here rather than left to chance. This commit is not the
      # deployed one and has not been since the engine merged; it is kept because
      # it MUST FAIL, which is what stops a green strict run being green by
      # accident.
      - name: negative control — the pre-engine base must NOT satisfy the evidence
        working-directory: apex-backend
        run: |
          git fetch --no-tags origin ${{ env.BACKEND_NEGATIVE_CONTROL_COMMIT }}
          git cat-file -e ${{ env.BACKEND_NEGATIVE_CONTROL_COMMIT }}^{commit}
          echo "pre-engine base present; the strict suite's negative controls will exercise it"

      - name: strict source facts, with the negative controls exercised
        working-directory: apex-trading
        env:
          PST_REQUIRE_BACKEND_SOURCE: '1'
          APEX_BACKEND_PATH: ${{ github.workspace }}/apex-backend
        run: node tests/portfolio-stress-source-facts.test.js
