name: temporary-journal-core-extract

on:
  push:
    branches:
      - agent/extract-journal-core-service

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/agent/extract-journal-core-service'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/extract-journal-core-service
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prove branch/base and extracted artifacts
        shell: bash
        run: |
          set -euo pipefail
          BASE=dfb8433e8e7b0403fca5a23874dfbc600f5069c4
          git merge-base --is-ancestor "$BASE" HEAD
          test -f js/services/journal-core.js
          test -f tests/tools/journal-core-extraction-pins.json
          grep -Fq '<script src="./js/services/journal-core.js"></script>' index.html

      - name: Historical reconstruction diagnostics
        shell: bash
        run: |
          set -euo pipefail
          echo '=== mcx-pr3-undo consumers ==='
          grep -RIl --include='*.test.js' "mcx-pr3-undo" tests | sort || true
          echo '=== direct undoMcxPr3 call sites ==='
          grep -RIn --include='*.test.js' "undoMcxPr3" tests | sort || true
          echo '=== MCX3 last-before-inline assertions ==='
          grep -RIn --include='*.test.js' -E "mcxBackend.*inline|MCX backend-candle.*LAST|mcx-backend-candles.*inline|three MCX owners|MCX owners" tests | sort || true
          echo '=== exact local-script counts near 43/44 ==='
          grep -RIn --include='*.test.js' -E "(43|44).*local|local.*(43|44)|length.*, *(43|44)|eq\([^,]*length, *(43|44)" tests | sort || true

      - name: Syntax and loader checks
        shell: bash
        run: |
          set -euo pipefail
          node --check js/services/journal-core.js
          node --check tests/lib/load-app-source.js
          node --check tests/journal-core-boundary-contract.test.js

      - name: Journal suites including extraction boundary
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/journal-*.test.js; do
            echo "=== $f ==="
            node "$f"
          done

      - name: Diff hygiene against pinned base
        shell: bash
        run: |
          set -euo pipefail
          git diff --check dfb8433e8e7b0403fca5a23874dfbc600f5069c4 HEAD
