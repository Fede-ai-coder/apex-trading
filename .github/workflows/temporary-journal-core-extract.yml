name: temporary-journal-core-extract

on:
  push:
    branches:
      - agent/extract-journal-core-service

permissions:
  contents: write

jobs:
  extract:
    if: github.ref == 'refs/heads/agent/extract-journal-core-service'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/extract-journal-core-service
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prove base ancestry and untouched production input
        shell: bash
        run: |
          set -euo pipefail
          BASE=dfb8433e8e7b0403fca5a23874dfbc600f5069c4
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --exit-code "$BASE" HEAD -- index.html
          test ! -e js/services/journal-core.js

      - name: Extract Journal core exactly
        run: python3 tests/tools/journal-core-extract.py

      - name: Syntax and loader checks
        shell: bash
        run: |
          set -euo pipefail
          node --check js/services/journal-core.js
          node --check tests/lib/load-app-source.js

      - name: Existing Journal suites
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/journal-*.test.js; do
            echo "=== $f ==="
            node "$f"
          done

      - name: Diff hygiene
        run: git diff --check

      - name: Commit extraction result to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Fede-ai-coder"
          git config user.email "federicograssettig@gmail.com"
          git add index.html js/services/journal-core.js tests/tools/journal-core-extraction-pins.json
          git commit -m "refactor(journal): extract core service"
          git push origin HEAD:agent/extract-journal-core-service
