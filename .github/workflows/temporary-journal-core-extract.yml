name: temporary-journal-core-extract

on:
  push:
    branches:
      - agent/extract-journal-core-service
  pull_request:
    branches:
      - dev-clean
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  verify:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'agent/extract-journal-core-service'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/extract-journal-core-service
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prove branch/base and extracted artifacts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = "agent/extract-journal-core-service"
          BASE=dfb8433e8e7b0403fca5a23874dfbc600f5069c4
          git merge-base --is-ancestor "$BASE" HEAD
          test -f js/services/journal-core.js
          grep -Fq '<script src="./js/services/journal-core.js"></script>' index.html

      - name: Apply historical repair once
        shell: bash
        run: |
          set -euo pipefail
          if test -f tests/tools/journal-core-historical-repair.done; then
            echo 'historical repair already committed; verification-only run'
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/tools/journal-core-repair-historical.py')
          s = p.read_text(encoding='utf-8')
          pairs = [
              (
                  r'''"const BACKEND_CANDLES_REL = 'js/services/mcx-backend-candles.js';\nsame(changedProduction''',
                  r'''"  const BACKEND_CANDLES_REL = 'js/services/mcx-backend-candles.js';\n  same(changedProduction''',
                  'MCX1 old-footprint indentation',
              ),
              (
                  r'''"const BACKEND_CANDLES_REL = 'js/services/mcx-backend-candles.js';\nconst JOURNAL_CORE_REL = 'js/services/journal-core.js';\nsame(changedProduction''',
                  r'''"  const BACKEND_CANDLES_REL = 'js/services/mcx-backend-candles.js';\n  const JOURNAL_CORE_REL = 'js/services/journal-core.js';\n  same(changedProduction''',
                  'MCX1 new-footprint indentation',
              ),
          ]
          for old, new, label in pairs:
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'REFUSE workflow normalization {label}: expected 1 exact match, got {n}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          python3 tests/tools/journal-core-repair-historical.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/backend-directional-snapshot-boundary-contract.test.js')
          s = p.read_text(encoding='utf-8')
          pairs = [
              (
                  "eq(deps.length, 9, 'the real document has exactly 9 cross-script LOAD-TIME dependencies (6 + the 2 W2 exposures + the SFS debug exposure)');",
                  "eq(deps.length, 12, 'the real document has exactly 12 cross-script LOAD-TIME dependencies (9 historical + 3 Journal CRUD bindings)');",
                  'DSB load-time dependency count',
              ),
              (
                  "     'apexDebugSfsDetailChart'],\n    'the 9 identifiers the inline monolith evaluates at load time from earlier modules');",
                  "     'apexDebugSfsDetailChart', 'jAddTrade', 'jDeleteTrade', 'jUpdateTrade'],\n    'the 12 identifiers the inline monolith evaluates at load time from earlier modules');",
                  'DSB load-time dependency names',
              ),
              (
                  "     './js/services/candle-normalization.js', './js/services/sfs-scan-service.js',\n     './js/ui/backend-directional-preview.js'],\n    'those 9 come from exactly 5 provider modules');",
                  "     './js/services/candle-normalization.js', './js/services/journal-core.js', './js/services/sfs-scan-service.js',\n     './js/ui/backend-directional-preview.js'],\n    'those 12 come from exactly 6 provider modules');",
                  'DSB provider modules',
              ),
              (
                  "    && MCX_EXTRACTION_SCRIPTS.indexOf(m.name) < 0;\n});\neq(AUDIT_TIME_MODULES.length, 20, 'the audit-time baseline is the 20 modules that predate the DSB extraction plan');",
                  "    && MCX_EXTRACTION_SCRIPTS.indexOf(m.name) < 0\n    && JOURNAL_EXTRACTION_SCRIPTS.indexOf(m.name) < 0;\n});\neq(AUDIT_TIME_MODULES.length, 20, 'the audit-time baseline is the 20 modules that predate the DSB extraction plan');",
                  'DSB audit-time baseline exclusion',
              ),
          ]
          for old, new, label in pairs:
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'REFUSE DSB metric repair {label}: expected 1 exact match, got {n}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Syntax-check repaired contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check js/services/journal-core.js
          node --check tests/lib/journal-core-undo.js
          node --check tests/lib/post-journal-mcx-pr3-undo.js
          node --check tests/journal-core-boundary-contract.test.js
          for f in \
            tests/backend-directional-adapter-boundary-contract.test.js \
            tests/backend-directional-preview-boundary-contract.test.js \
            tests/backend-directional-snapshot-boundary-contract.test.js \
            tests/backend-scanner-snapshot-ui-boundary-contract.test.js \
            tests/eic-extraction-boundary-contract.test.js \
            tests/mcx-backend-candles-boundary-contract.test.js \
            tests/mcx-market-context-boundary-contract.test.js \
            tests/mcx-vix-market-context-boundary-contract.test.js \
            tests/pess-extraction-boundary-contract.test.js \
            tests/pretrade-risk-modal-boundary-contract.test.js \
            tests/pretrade-risk-rules-boundary-contract.test.js \
            tests/pretrade-technicals-boundary-contract.test.js \
            tests/sfs-extraction-boundary-contract.test.js; do
            node --check "$f"
          done

      - name: Focused historical and Journal proof
        shell: bash
        run: |
          set -uo pipefail
          : > /tmp/focused-failure.txt
          for f in \
            tests/journal-core-boundary-contract.test.js \
            tests/backend-directional-adapter-boundary-contract.test.js \
            tests/backend-directional-preview-boundary-contract.test.js \
            tests/backend-directional-snapshot-boundary-contract.test.js \
            tests/backend-scanner-snapshot-ui-boundary-contract.test.js \
            tests/eic-extraction-boundary-contract.test.js \
            tests/mcx-backend-candles-boundary-contract.test.js \
            tests/mcx-market-context-boundary-contract.test.js \
            tests/mcx-vix-market-context-boundary-contract.test.js \
            tests/pess-extraction-boundary-contract.test.js \
            tests/pretrade-risk-modal-boundary-contract.test.js \
            tests/pretrade-risk-rules-boundary-contract.test.js \
            tests/pretrade-technicals-boundary-contract.test.js \
            tests/sfs-extraction-boundary-contract.test.js; do
            echo "=== $f ==="
            if node "$f" > /tmp/focused-current.log 2>&1; then
              tail -8 /tmp/focused-current.log
            else
              rc=$?
              {
                echo "FAILED_FILE=$f"
                echo "EXIT_CODE=$rc"
                echo "--- FAILURES WITH EXPECTED/GOT CONTEXT ---"
                grep -n -B2 -A5 'FAIL  ' /tmp/focused-current.log || true
                echo "--- SUMMARY FAILURE LIST ---"
                grep -n -A20 '^FAILURES:' /tmp/focused-current.log || true
              } > /tmp/focused-failure.txt
              cat /tmp/focused-failure.txt
              exit "$rc"
            fi
          done

      - name: Upload focused failure diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: journal-core-focused-failure
          path: /tmp/focused-failure.txt
          if-no-files-found: error
          retention-days: 1

      - name: Diff hygiene
        run: git diff --check

      - name: Commit successful one-shot repair
        shell: bash
        run: |
          set -euo pipefail
          if test -f tests/tools/journal-core-historical-repair.done; then
            echo 'already committed; no-op'
            exit 0
          fi
          printf '%s\n' 'focused Journal + historical contracts passed before this marker was committed' > tests/tools/journal-core-historical-repair.done
          git config user.name "Fede-ai-coder"
          git config user.email "federicograssettig@gmail.com"
          git add tests/*.test.js tests/tools/journal-core-historical-repair.done
          git commit -m "test(journal): preserve historical reconstruction after core extraction"
          git push origin HEAD:agent/extract-journal-core-service

# repair-trigger: measured-dsb-metrics
