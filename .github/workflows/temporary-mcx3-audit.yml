name: temporary-mcx3-final-diagnostic

on:
  pull_request:
    branches: [dev-clean]

jobs:
  diagnose:
    if: github.head_ref == 'agent/extract-mcx-backend-candle-service'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: MCX3 boundary contract
        run: |
          node --check tests/mcx-backend-candles-boundary-contract.test.js
          node tests/mcx-backend-candles-boundary-contract.test.js

      - name: full-suite diagnostic
        run: |
          set +e
          fail=0
          : > /tmp/failures.txt
          total=0
          green=0
          for f in tests/*.test.js; do
            total=$((total+1))
            out="/tmp/$(basename "$f").log"
            node "$f" >"$out" 2>&1
            rc=$?
            if [ "$rc" -eq 0 ]; then
              green=$((green+1))
              continue
            fi
            fail=1
            echo "$f" >> /tmp/failures.txt
            echo "=== FAIL $f ==="
            grep -E '(^|  )(FAIL|FAILURES:|FAILED|✗|• |AssertionError|Error:|expected .*got|suite failed)' "$out" | tail -n 80 || tail -n 50 "$out"
          done
          echo "FULL_SUITE total=$total green=$green red=$((total-green))"
          if [ -s /tmp/failures.txt ]; then
            echo 'FAILING_FILES_BEGIN'
            cat /tmp/failures.txt
            echo 'FAILING_FILES_END'
          fi
          set -e
          exit "$fail"
