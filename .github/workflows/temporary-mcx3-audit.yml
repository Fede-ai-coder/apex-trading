name: temporary-mcx3-contract-inventory

on:
  pull_request:
    branches: [dev-clean]

jobs:
  inventory:
    if: github.head_ref == 'agent/extract-mcx-backend-candle-service'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: enumerate historical reconstruction and script-inventory consumers
        run: |
          echo '=== mcx-pr2 undo consumers ==='
          grep -R -n --include='*.js' "mcx-pr2-undo" tests || true
          echo '=== MCX2 tag / owner-order consumers ==='
          grep -R -n --include='*.js' "mcx-vix-market-context.js" tests || true
          echo '=== MCX owner count prose/assertions ==='
          grep -R -n --include='*.js' -E "both MCX owners|two MCX owners|MCX owners|mcx-market-context.js.*mcx-vix-market-context.js" tests || true
          echo '=== backend candle helper consumers ==='
          grep -R -n --include='*.js' "_mcxFetchBackendCandlesForChart" tests || true
          echo '=== current service script count references ==='
          grep -R -n --include='*.js' -E "script(s)?[^[:alnum:]]*(42|43)|42[^[:alnum:]]*script|43[^[:alnum:]]*script" tests || true
