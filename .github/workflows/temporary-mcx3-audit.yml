name: temporary-mcx3-reconstruction-repair

on:
  pull_request:
    branches: [dev-clean]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'agent/extract-mcx-backend-candle-service'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: prepare newest-first reconstruction repair
        run: |
          python tests/tools/mcx3-repair-reconstruction.py
          # DSB needs piecewise offset treatment: both shared-price outliers are
          # above the MCX3 cuts, so the generic +12,006 subtraction is invalid.
          git checkout -- tests/backend-directional-snapshot-boundary-contract.test.js
          node --check tests/lib/mcx-pr3-undo.js
          for f in \
            tests/eic-extraction-boundary-contract.test.js \
            tests/pretrade-risk-modal-boundary-contract.test.js \
            tests/pretrade-technicals-boundary-contract.test.js \
            tests/pretrade-risk-rules-boundary-contract.test.js \
            tests/mcx-market-context-boundary-contract.test.js \
            tests/sfs-extraction-boundary-contract.test.js \
            tests/pess-extraction-boundary-contract.test.js; do
            node --check "$f"
          done
      - name: prove PR3 undo identity and no reconstruction-chain crash
        run: |
          node - <<'JS'
          const fs = require('fs');
          const U = require('./tests/lib/mcx-pr3-undo.js');
          const html = fs.readFileSync('index.html','utf8');
          const mod = fs.readFileSync('js/services/mcx-backend-candles.js','utf8');
          const rebuilt = U.undoMcxPr3(html, mod);
          if (rebuilt.length !== U.BASE_CHARS) throw new Error('rebuilt length mismatch');
          console.log('MCX3 undo exact identity: PASS');
          JS
          set +e
          bad=0
          for f in \
            tests/eic-extraction-boundary-contract.test.js \
            tests/pretrade-risk-modal-boundary-contract.test.js \
            tests/pretrade-technicals-boundary-contract.test.js \
            tests/pretrade-risk-rules-boundary-contract.test.js \
            tests/mcx-market-context-boundary-contract.test.js \
            tests/sfs-extraction-boundary-contract.test.js \
            tests/pess-extraction-boundary-contract.test.js; do
            out="/tmp/$(basename "$f").log"
            node "$f" >"$out" 2>&1
            rc=$?
            echo "=== $f rc=$rc ==="
            tail -n 30 "$out"
            if grep -Eq 'MCX_PR[123]_UNDO_(BASE_IDENTITY|MODULE_IDENTITY|TAG_IDENTITY|OFFSET|FUNC_|STATE_|SEPARATOR)' "$out"; then
              echo "unexpected MCX undo-chain failure in $f"
              bad=1
            fi
          done
          set -e
          test "$bad" -eq 0
          git diff --check
      - name: commit only historical reconstruction repairs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tests/eic-extraction-boundary-contract.test.js \
            tests/pretrade-risk-modal-boundary-contract.test.js \
            tests/pretrade-technicals-boundary-contract.test.js \
            tests/pretrade-risk-rules-boundary-contract.test.js \
            tests/mcx-market-context-boundary-contract.test.js \
            tests/sfs-extraction-boundary-contract.test.js \
            tests/pess-extraction-boundary-contract.test.js
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'test(mcx): chain PR3 reconstruction newest-first'
          git push origin HEAD:agent/extract-mcx-backend-candle-service
