name: temporary-mcx3-extraction

on:
  pull_request:
    branches: [dev-clean]

permissions:
  contents: write

jobs:
  extract:
    if: github.head_ref == 'agent/extract-mcx-backend-candle-service'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: prepare exact MCX3 relocation
        env:
          BASE_SHA: 2b61bbd1ed11f227032529e9147c82434b5720b2
        run: python tests/tools/mcx3-extract.py

      - name: focused proof before push
        run: |
          node --check js/services/mcx-backend-candles.js
          node tests/mcx-backend-candles.test.js
          node tests/mcx-refresh-on-open-freshness.test.js
          node tests/load-app-source.test.js
          git diff --check

      - name: commit relocation only
        env:
          BRANCH: agent/extract-mcx-backend-candle-service
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/services/mcx-backend-candles.js
          git commit -m "refactor(mcx): extract backend-candle cache service"
          git push origin "HEAD:$BRANCH"
