name: Rebase and validate PR 310

on:
  pull_request:
    branches:
      - dev-clean
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  rebase-test-push:
    if: github.event.pull_request.number == 310
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR 310 head
        uses: actions/checkout@v4
        with:
          ref: claude/swing-chart-live-quote-lease
          fetch-depth: 0

      - name: Rebase PR 310 onto current dev-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin dev-clean claude/swing-chart-live-quote-lease --force
          git checkout -B pr310 origin/claude/swing-chart-live-quote-lease
          if [ -f .tmp-trigger-pr310 ]; then git reset --hard HEAD~1; fi
          git rebase --onto origin/dev-clean 7c710c87844669e7e27fc16f5e17615432669bdf

      - name: Verify rebased diff scope
        run: |
          actual="$(git diff --name-only origin/dev-clean...HEAD | sort)"
          expected="$(printf '%s\n' index.html tests/swing-chart-quote-lease.test.js | sort)"
          printf 'Actual files:\n%s\n' "$actual"
          test "$actual" = "$expected"
          git diff --check origin/dev-clean...HEAD

      - name: Run PR 310 regression tests
        run: |
          node tests/swing-chart-quote-lease.test.js
          node tests/swing-chart-live-price-parity.test.js
          node tests/swing-source-bias-direction.test.js
          node tests/swing-trading.test.js
          node tests/scanner-chart-live-patch.test.js
          node tests/portfolio-price-resolver-cascade.test.js

      - name: Check inline script syntax
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import subprocess
          import tempfile

          html = pathlib.Path('index.html').read_text()
          blocks = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>', html, flags=re.I)
          for i, block in enumerate(blocks):
              path = pathlib.Path(tempfile.gettempdir()) / f'apex-inline-{i}.js'
              path.write_text(block)
              subprocess.run(['node', '--check', str(path)], check=True)
          print(f'checked {len(blocks)} inline scripts')
          PY

      - name: Push rebased PR branch
        run: |
          git push --force-with-lease origin HEAD:refs/heads/claude/swing-chart-live-quote-lease
