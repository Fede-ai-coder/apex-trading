name: Validate PR 309

on:
  pull_request:
    branches:
      - dev-clean
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  test-pr309:
    if: github.head_ref == 'claude/swing-source-bias-vs-direction'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify diff scope
        run: |
          git fetch origin dev-clean --force
          actual="$(git diff --name-only origin/dev-clean...HEAD | sort)"
          expected="$(printf '%s\n' \
            index.html \
            tests/swing-chart-live-price-parity.test.js \
            tests/swing-source-bias-direction.test.js \
            tests/swing-trading.test.js | sort)"
          printf 'Actual files:\n%s\n' "$actual"
          test "$actual" = "$expected"
          git diff --check origin/dev-clean...HEAD

      - name: Run PR 309 regression tests
        run: |
          node tests/swing-chart-live-price-parity.test.js
          node tests/swing-source-bias-direction.test.js
          node tests/swing-trading.test.js

      - name: Check inline script syntax
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import subprocess
          import tempfile

          html = pathlib.Path('index.html').read_text()
          blocks = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>', html, flags=re.I)
          for i, block in enumerate(blocks):
              path = pathlib.Path(tempfile.gettempdir()) / f'apex-inline-{i}.js'
              path.write_text(block)
              subprocess.run(['node', '--check', str(path)], check=True)
          print(f'checked {len(blocks)} inline scripts')
          PY
