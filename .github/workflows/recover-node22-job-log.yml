name: recover-original-node22-job-log

on:
  push:
    branches:
      - diagnostic/recover-node22-job-95810718170

permissions:
  actions: read
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact original job log
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --location --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/95810718170/logs" \
            --output node22-job-95810718170.log
          test -s node22-job-95810718170.log
          wc -c node22-job-95810718170.log

      - name: Upload recovered log
        uses: actions/upload-artifact@v4
        with:
          name: node22-job-95810718170-log
          path: node22-job-95810718170.log
          if-no-files-found: error
          retention-days: 1
