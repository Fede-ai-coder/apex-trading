# TEMPORARY, PR #563 only. Remove after diagnosing the real Node runtime failure.
# Full frontend matrix fails late and tails only the final 40 lines from the
# test output, hiding the lifecycle stack. This isolated job preserves it.
name: temporary-volatility-coverage-yz-diagnostic
on:
  pull_request:
    branches: [dev-clean]
jobs:
  isolated-coverage:
    if: github.event.pull_request.number == 563
    name: coverage lifecycle diagnostic (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # permanent extraction contracts require historical commits
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: standalone Coverage lifecycle and Yang-Zhang contract, unfiltered output
        run: node tests/dashboard-market-scanner-layout.test.js
